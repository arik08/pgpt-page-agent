<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모션 고르기 · 페이지 에이전트</title>
<style>
  :root {
    --bg: #141210; --bg2: #1b1815; --bg3: #25211d; --line: rgba(238,226,214,.10); --line2: rgba(238,226,214,.18);
    --text: #eee7e0; --text2: #b5aba2; --text3: #958b82; --pick: #ff9a3c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 1rem; line-height: 1.7; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere;
  }
  ::selection { background: rgba(240,106,22,.38); color: #fff; }
  a { color: #ffb36b; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--pick); outline-offset: 3px; border-radius: 6px; }
  main { max-width: 84rem; margin: 0 auto; padding: 3.5rem 1.5rem 9rem; }
  h1 { font-size: 2rem; line-height: 1.3; letter-spacing: -.03em; margin: 0 0 .5rem; font-weight: 750; color: #fff6ee; }
  .lead { color: var(--text2); margin: 0 0 1.75rem; max-width: 46rem; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .75rem 0; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
  .bar-label { color: var(--text3); font-size: .875rem; margin-right: .25rem; }
  .btn {
    height: 2.5rem; padding: 0 .95rem; border-radius: .75rem; font: inherit; font-size: .9375rem; color: var(--text);
    background: var(--bg3); border: 1px solid var(--line2); cursor: pointer; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #312b26; }
  .btn[aria-pressed="true"] { border-color: var(--pick); color: #fff6ee; }
  .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; }
  @media (max-width: 75rem) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 46rem) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .tile {
    display: flex; flex-direction: column; text-align: left; font: inherit; color: inherit; padding: 0; cursor: pointer;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; transition: border-color .15s;
  }
  .tile:hover { border-color: var(--line2); }
  .tile[aria-pressed="true"] { border-color: var(--pick); box-shadow: 0 0 0 1px var(--pick); }
  .stage { position: relative; height: 11rem; display: grid; place-items: center; background: #0e0c0b; transition: background .25s; }
  .light .stage { background: #f4f1ec; }
  .orb-slot { position: relative; width: 150px; height: 150px; }
  .orb-slot .blob { position: absolute; left: 0; top: 0; width: 150px; height: 150px; overflow: visible; pointer-events: none; }
  .info { padding: .875rem 1rem 1rem; border-top: 1px solid var(--line); }
  .name { font-weight: 700; color: #fff6ee; }
  .rule { font-size: .875rem; color: var(--text2); }
  .detail { margin-top: 2rem; padding: 1.5rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--bg2); max-width: 62rem; }
  .detail h2 { margin: 0 0 .25rem; font-size: 1.25rem; color: #fff6ee; letter-spacing: -.01em; }
  .detail p { margin: .5rem 0; color: var(--text2); }
  .detail ul { margin: .75rem 0 1rem; padding-left: 1.25rem; color: var(--text2); }
  .detail li { margin: .2rem 0; }
  .detail li b { color: var(--text); font-weight: 600; }
  code { font-family: D2Coding, Consolas, monospace; font-size: .9375rem; background: rgba(238,226,214,.08); padding: .1rem .4rem; border-radius: .375rem; }
  .how { display: grid; gap: .5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .how div { color: var(--text2); }
  .how b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>모션 고르기</h1>
  <p class="lead">같은 에이전트를 열 가지 움직임으로 만들어 두었습니다. 상태 버튼으로 열 개를 한꺼번에 비교하고, 마음에 드는 것을 누르면 오른쪽 아래 방울과 대화창에 바로 적용됩니다. <a href="/">설치 페이지로</a></p>

  <div class="bar" id="bar">
    <span class="bar-label">상태</span>
    <span class="spacer"></span>
    <button class="btn" type="button" id="cycle">차례로 재생</button>
    <button class="btn" type="button" id="bgtoggle" aria-pressed="false">밝은 배경에서 보기</button>
  </div>

  <div class="grid" id="grid"></div>

  <section class="detail" id="detail" aria-live="polite"></section>
</main>
<script>
  window.__pageAgentServer = location.origin;
  window.__pageAgentAutoOpen = false;
</script>
<script src="/agent.js"></script>
<script>
(function () {
  var M = window.__pageAgentMotions, A = window.__pageAgent, SERVER_DEFAULT = "{{MOTION}}";
  if (!M || !A) return;
  var STATES = [["idle", "대기"], ["listening", "입력 중"], ["reading", "페이지 읽기"], ["thinking", "생각"], ["searching", "웹 검색"], ["answering", "답변 중"], ["error", "오류"]];
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var grid = document.getElementById("grid"), bar = document.getElementById("bar"), detail = document.getElementById("detail");
  var orbs = [], tiles = {}, stateBtns = {}, current = "idle";

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  M.list().forEach(function (t, i) {
    var tile = el("button", { class: "tile", type: "button", "aria-pressed": "false" });
    var stage = el("div", { class: "stage" }), slot = el("div", { class: "orb-slot" });
    stage.appendChild(slot);
    var info = el("div", { class: "info" });
    info.appendChild(el("div", { class: "name" }, (i + 1) + ". " + t.name));
    info.appendChild(el("div", { class: "rule" }, t.rule));
    tile.appendChild(stage); tile.appendChild(info);
    grid.appendChild(tile);
    var orb = M.createOrb(slot, t.id, { reduced: reduced, box: 150 });
    orbs.push(orb); tiles[t.id] = tile;
    // 실제 방울처럼 커서에 기울고 누르면 눌린다
    stage.addEventListener("pointermove", function (e) {
      var r = slot.getBoundingClientRect(), dx = e.clientX - (r.left + 75), dy = e.clientY - (r.top + 75), d = Math.hypot(dx, dy);
      orb.P.hover = d < 40;
      if (d > 0.1) { var k = Math.max(0, 1 - d / 170) * 3.5; orb.P.tlx = dx / d * k; orb.P.tly = dy / d * k; }
    });
    stage.addEventListener("pointerleave", function () { orb.P.hover = false; orb.P.pressed = false; orb.P.tlx = 0; orb.P.tly = 0; });
    tile.addEventListener("pointerdown", function () { orb.P.pressed = true; });
    tile.addEventListener("pointerup", function () { orb.P.pressed = false; if (!reduced) { orb.P.vsy += 2.6; orb.P.vsx -= 1.4; } });
    tile.addEventListener("click", function () { pick(t.id); });
  });

  var spacer = bar.querySelector(".spacer");
  STATES.forEach(function (s) {
    var b = el("button", { class: "btn", type: "button", "aria-pressed": "false" }, s[1]);
    b.addEventListener("click", function () { stopCycle(); setState(s[0]); });
    bar.insertBefore(b, spacer);
    stateBtns[s[0]] = b;
  });

  function setState(ph) {
    current = ph;
    for (var k in stateBtns) stateBtns[k].setAttribute("aria-pressed", String(k === ph));
    orbs.forEach(function (o) { o.setPhase(ph); });
    A.showPhase(ph, ph === "error" ? 1600 : 6000);
  }

  // 답변 중에는 글자가 흘러나오는 박자를 흉내 낸다
  setInterval(function () { if (current === "answering" && !reduced) orbs.forEach(function (o) { o.kick(0.012); o.P.vsy += 0.18; }); }, 60);

  var cycleTimer = 0;
  function stopCycle() { clearTimeout(cycleTimer); cycleTimer = 0; document.getElementById("cycle").setAttribute("aria-pressed", "false"); }
  document.getElementById("cycle").addEventListener("click", function () {
    if (cycleTimer) { stopCycle(); setState("idle"); return; }
    this.setAttribute("aria-pressed", "true");
    var seq = [["listening", 1600], ["reading", 1500], ["thinking", 2600], ["searching", 2600], ["thinking", 1400], ["answering", 4200], ["idle", 3200], ["error", 1600], ["idle", 2400]], i = 0;
    (function next() { setState(seq[i][0]); cycleTimer = setTimeout(next, seq[i][1]); i = (i + 1) % seq.length; })();
  });
  document.getElementById("bgtoggle").addEventListener("click", function () {
    var on = grid.classList.toggle("light");
    this.setAttribute("aria-pressed", String(on));
  });

  function pick(id) {
    var t = M.get(id);
    A.setMotion(id, true);
    for (var k in tiles) tiles[k].setAttribute("aria-pressed", String(k === id));
    while (detail.firstChild) detail.removeChild(detail.firstChild);
    detail.appendChild(el("h2", null, t.name + " — " + t.rule));
    detail.appendChild(el("p", null, t.concept));
    var ul = el("ul");
    var moves = t.moves ? t.moves.split(" · ") : ["대기: " + t.about.idle, "생각: " + t.about.thinking, "검색: " + t.about.searching, "답변: " + t.about.answering, "오류: " + t.about.error, "누름: " + t.about.press];
    moves.forEach(function (m) {
      var i = m.indexOf(":"), li = el("li");
      li.appendChild(el("b", null, m.slice(0, i)));
      li.appendChild(document.createTextNode(m.slice(i)));
      ul.appendChild(li);
    });
    detail.appendChild(ul);
    var how = el("div", { class: "how" });
    var d1 = el("div"); d1.appendChild(el("b", null, "지금: ")); d1.appendChild(document.createTextNode("오른쪽 아래 방울에 적용했습니다. 눌러서 대화창을 열고 직접 물어보세요. 이 서버의 페이지에서는 이 선택이 기억됩니다."));
    var d2 = el("div"); d2.appendChild(el("b", null, "모두의 기본값으로: ")); d2.appendChild(document.createTextNode("서버 폴더의 .env에 "));
    d2.appendChild(el("code", null, "AGENT_MOTION=" + id)); d2.appendChild(document.createTextNode(" 를 넣고 서버를 다시 실행합니다." + (id === SERVER_DEFAULT ? " (지금 기본값입니다)" : "")));
    var d3 = el("div"); d3.appendChild(el("b", null, "나만 다르게: ")); d3.appendChild(document.createTextNode("북마크 주소 안의 /agent.js 를 "));
    d3.appendChild(el("code", null, "/agent.js?m=" + id)); d3.appendChild(document.createTextNode(" 로 바꾸면 그 북마크는 이 모션으로 열립니다."));
    how.appendChild(d1); how.appendChild(d2); how.appendChild(d3);
    detail.appendChild(how);
  }

  var last = performance.now();
  (function loop(t) {
    var dt = Math.min(0.05, Math.max(0.001, (t - last) / 1000)); last = t;
    for (var i = 0; i < orbs.length; i++) { orbs[i].step(dt); orbs[i].draw(dt); }
    requestAnimationFrame(loop);
  })(last);

  pick(A.motion());
  setState("idle");
})();
</script>
</body>
</html>
